name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Build Binaries
      run: |
        mkdir -p dist
        GOOS=linux GOARCH=amd64 go build -o dist/broker-linux-amd64 ./cmd/broker
        GOOS=linux GOARCH=amd64 go build -o dist/client-linux-amd64 ./cmd/client
        GOOS=windows GOARCH=amd64 go build -o dist/broker-windows-amd64.exe ./cmd/broker
        GOOS=windows GOARCH=amd64 go build -o dist/client-windows-amd64.exe ./cmd/client
        GOOS=darwin GOARCH=amd64 go build -o dist/broker-darwin-amd64 ./cmd/broker
        GOOS=darwin GOARCH=amd64 go build -o dist/client-darwin-amd64 ./cmd/client
        GOOS=darwin GOARCH=arm64 go build -o dist/broker-darwin-arm64 ./cmd/broker
        GOOS=darwin GOARCH=arm64 go build -o dist/client-darwin-arm64 ./cmd/client
        cd dist
        sha256sum * > checksums.txt

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/broker-linux-amd64
          dist/client-linux-amd64
          dist/broker-windows-amd64.exe
          dist/client-windows-amd64.exe
          dist/broker-darwin-amd64
          dist/client-darwin-amd64
          dist/broker-darwin-arm64
          dist/client-darwin-arm64
          dist/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
